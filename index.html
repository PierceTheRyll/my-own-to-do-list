<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>MyNote</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
<style>
:root{--t:#f2f2f6;--m:#9494a0;--p:#8b5cf6;--pl:#a78bfa;--gl:rgba(30,30,35,.6);--bd:rgba(255,255,255,.11);--in:rgba(18,18,21,.75);--row:rgba(44,44,52,.62);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow-x:hidden;overflow-y:auto;color:var(--t);background:#15121d;
font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
background:radial-gradient(circle at 90% 0%,rgba(124,58,237,.38),transparent 45%),radial-gradient(circle at 0% 100%,rgba(109,40,217,.28),transparent 50%),linear-gradient(#17171a,#08080a) #0a0a0c;background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{position:relative;max-width:480px;min-height:100%;margin:0 auto;padding:22px 18px 28px;display:flex;flex-direction:column;animation:fi .7s ease backwards}
#app>*{position:relative;z-index:1}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@keyframes sf{to{opacity:1}}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{margin:6px 0 4px;font-size:27px;line-height:1.15}
#sub{color:var(--m);font-size:14px}
[data-i],#sub{transition:opacity .16s}
.seg{--n:2;position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:4px;border-radius:16px;background:var(--in);border:1px solid var(--bd)}
.seg button{position:relative;z-index:1;padding:6px 12px;border-radius:12px;font-size:13px;font-weight:600;color:var(--m);transition:color .25s,background-color .7s,opacity .16s}
.seg button.on{color:var(--t)}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:12px;background:var(--p);box-shadow:0 4px 14px rgba(139,92,246,.45);transition:transform .32s cubic-bezier(.3,.9,.3,1)}
.tabs button{padding:9px 0;font-size:14px}
.track{height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin:12px 0 16px;overflow:hidden}
#fill{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--p),var(--pl));transition:width .55s cubic-bezier(.3,.9,.3,1)}
.add{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 20px;border-radius:28px;background:var(--in);border:1px solid var(--bd);margin-bottom:12px;transition:border-color .25s,box-shadow .25s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.add:focus-within{border-color:var(--pl);box-shadow:0 0 0 3px rgba(167,139,250,.2)}
#inp,#dt{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--t);font:inherit;font-size:16px}
#inp::placeholder,#dt::placeholder{color:var(--m)}
#go,#dgo{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.1);font-size:24px;line-height:1}
.tabs{margin-bottom:14px}
#panel{position:relative;flex:none;height:min(50vh,440px);min-height:260px;overflow-y:auto;scrollbar-width:none;padding:12px;border-radius:28px;background:var(--gl);border:1px solid var(--bd);
backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 24px 50px rgba(0,0,0,.3)}
#panel::-webkit-scrollbar{display:none}
ul{margin:0;padding:0;list-style:none}
li{margin-bottom:8px;overflow:hidden;border-radius:18px}
.row{display:flex;align-items:center;gap:12px;height:54px;padding:0 8px 0 14px;border-radius:18px;background:var(--row);border:1px solid rgba(255,255,255,.07);transition:background .2s}
.row:hover{background:rgba(70,70,82,.7)}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--m);display:grid;place-items:center;font-size:13px;font-weight:700;color:transparent;transition:all .28s cubic-bezier(.3,.9,.3,1)}
.done .chk{background:var(--p);border-color:var(--pl);color:#fff;transform:scale(1.08)}
.txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .3s}
.done .txt{color:var(--m);text-decoration:line-through}
.del{flex:none;width:36px;height:36px;border-radius:50%;color:var(--m);opacity:.55;transition:opacity .2s,color .2s}
.del:hover{opacity:1;color:#f0abfc}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;white-space:pre-line;color:var(--m);opacity:0;pointer-events:none;transition:opacity .5s}
#empty.show{opacity:1}
[hidden]{display:none!important}
.hr{display:flex;align-items:center;gap:8px}
.me{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px 0 4px;border-radius:19px;background:var(--in);border:1px solid var(--bd);color:var(--m)}
.me b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--pl));color:#fff;font-size:14px}
#app.locked>*:not(#sil){opacity:0;pointer-events:none;transition:opacity .35s}
@keyframes up{from{opacity:0;transform:translateY(16px);filter:blur(6px)}}
#app.enter>*:not(#sil){animation:up .65s cubic-bezier(.2,.8,.2,1) backwards}
#auth{position:fixed;inset:0;z-index:3;display:grid;place-items:center;padding:20px;overflow-y:auto;transition:opacity .5s,transform .5s,filter .5s}
#auth.out{opacity:0;transform:scale(1.04);filter:blur(12px);pointer-events:none}
.card{width:min(390px,100%);padding:22px 20px 18px;border-radius:32px;background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 30px 70px rgba(0,0,0,.4);animation:pop .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.96)}}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brand b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--pl));box-shadow:0 4px 14px rgba(139,92,246,.5)}
.card h2{margin:6px 0 4px;font-size:19px;text-align:center}.card p{margin:0 0 16px;color:var(--m);font-size:14px;text-align:center}
.fld{display:flex;align-items:center;gap:8px;height:50px;margin-top:10px;padding:0 10px 0 18px;border-radius:26px;background:var(--in);border:1px solid var(--bd);transition:border-color .25s,box-shadow .25s}
.fld:focus-within{border-color:var(--pl);box-shadow:0 0 0 3px rgba(167,139,250,.2)}
.fld input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--t);font:inherit;font-size:16px}
.fld input::placeholder{color:var(--m)}
#eye{font-size:13px;color:var(--pl);padding:6px}
.conf{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .4s cubic-bezier(.3,.9,.3,1),opacity .3s}
.conf>div{overflow:hidden}.signup .conf{grid-template-rows:1fr;opacity:1}
#err{min-height:20px;margin:12px 4px 0;font-size:13px;color:#f9a8d4;opacity:0;transition:opacity .25s}#err.show{opacity:1}
#submit{width:100%;height:50px;margin-top:4px;border-radius:26px;font-weight:700;font-size:16px;background:rgba(255,255,255,.1);border:1px solid var(--bd)}
#submit.busy{pointer-events:none;animation:pl 1s infinite}@keyframes pl{50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
.card small{display:block;margin-top:14px;text-align:center;color:var(--m);font-size:12px}
#app.enter>:not(#sil):nth-child(2){animation-delay:.08s}
.b{position:relative;isolation:isolate;overflow:hidden;transition:color .4s,transform .15s,box-shadow .7s,opacity .16s}
.b::before,.b::after{content:"";position:absolute;inset:0;z-index:-1;opacity:0}
.b::before{background:linear-gradient(135deg,#a78bfa,#7c3aed 60%,#6d28d9);transition:opacity .9s ease}
.b::after{background:linear-gradient(135deg,#7c3aed,#5b21b6);transition:opacity .35s ease}
@media(hover:hover){.b:hover::before{opacity:.92}.b:hover{color:#fff;box-shadow:0 8px 26px rgba(139,92,246,.35)}
.seg button:not(.on):hover{background:rgba(139,92,246,.3);color:#fff}}
.b:active::after{opacity:1;transition:opacity .1s}.b:active{transform:scale(.96)}
.seg button:active{background:rgba(139,92,246,.6)}
.or{display:flex;align-items:center;gap:10px;margin:14px 0 6px;color:var(--m);font-size:12px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--bd)}
#guest{width:100%;height:46px;margin-top:6px;border-radius:26px;background:rgba(255,255,255,.06);border:1px solid var(--bd);font-weight:600}
.gn{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:8px 8px 8px 14px;border-radius:18px;background:rgba(139,92,246,.12);border:1px solid rgba(167,139,250,.25);font-size:13px;color:var(--m);animation:up .5s cubic-bezier(.2,.8,.2,1)}
.gn .b{flex:none;padding:7px 14px;border-radius:14px;background:rgba(255,255,255,.1);font-size:13px;font-weight:600;color:var(--t)}
#prof{position:fixed;inset:0;z-index:4;display:grid;place-items:center;padding:20px;overflow-y:auto;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .4s}
#prof.out{opacity:0;pointer-events:none}
.ptitle{font-size:20px}.x{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08)}
.pav{width:84px;height:84px;margin:16px auto 8px;border-radius:50%;display:grid;place-items:center;font-size:36px;font-weight:700;color:#fff;box-shadow:0 12px 34px rgba(139,92,246,.4)}
.lbl{margin:14px 4px 8px;color:var(--m);font-size:13px}
.sw,.em{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:32px;height:32px;border-radius:50%;border:2px solid transparent;transition:transform .25s,border-color .4s}
.sw button:hover{transform:scale(1.12)}.sw button.on{border-color:#fff;transform:scale(1.15)}
.em button{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.08);font-size:18px}.em button.on{outline:2px solid var(--pl)}
.acts{display:flex;gap:10px;margin-top:18px}.acts .b{flex:1;height:46px;border-radius:24px;background:rgba(255,255,255,.1);border:1px solid var(--bd);font-weight:600}
.pn{margin:16px 0 0;text-align:center;color:var(--m);font-size:13px}
.sn{margin:-1px 0 5px;font:700 13px "Bricolage Grotesque","Arial Black",sans-serif;color:var(--pl);letter-spacing:.6px}
.wm{margin:16px 0 6px;text-align:center;font:800 clamp(30px,9.5vw,42px)/1.05 "Bricolage Grotesque","Arial Black",Impact,sans-serif;font-variation-settings:"opsz" 96;letter-spacing:-.8px;
background:linear-gradient(100deg,#fff 0%,#c4b5fd 35%,#8b5cf6 65%,#fff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s ease-in-out infinite alternate}
@keyframes sh{to{background-position:100% 0}}
.lang i{background:#dc2626 linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0));box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.95),0 4px 14px rgba(220,38,38,.5);transition:transform .32s cubic-bezier(.3,.9,.3,1),background-color .55s,box-shadow .55s}
.lang[data-v="1"] i{background-color:#2563eb;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0),0 4px 14px rgba(37,99,235,.5)}
.lang button.on{color:#fff}
@media(hover:hover){.lang button[data-l="id"]:not(.on):hover{background:rgba(220,38,38,.35)}.lang button[data-l="en"]:not(.on):hover{background:rgba(37,99,235,.4)}}
.lang button[data-l="id"]:active{background:rgba(220,38,38,.7)}.lang button[data-l="en"]:active{background:rgba(37,99,235,.7)}
#main{display:flex;flex-direction:column;gap:18px}#tasks{display:flex;flex-direction:column;min-width:0}
#notes{display:flex;flex-direction:column;min-width:0;min-height:260px;padding:16px 16px 12px;border-radius:28px;background:var(--gl);border:1px solid var(--bd);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 50px rgba(0,0,0,.3);transition:border-color .3s,box-shadow .4s}
#notes:focus-within{border-color:rgba(167,139,250,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 3px rgba(139,92,246,.15),0 24px 50px rgba(0,0,0,.3)}
#app.enter #notes{animation:up .7s .3s cubic-bezier(.2,.8,.2,1) backwards}
.nh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.ns{font-size:12px;font-weight:400;color:var(--m)}
#nb{flex:1;min-height:180px;width:100%;resize:none;background:none;border:0;outline:0;color:var(--t);font:inherit;font-size:15px;line-height:1.65}
#nb::placeholder{color:var(--m)}
@media(min-width:860px){#app{max-width:1040px;height:100%}
#main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);gap:22px}
#tasks,#notes{min-height:0}#panel{flex:1;height:auto;min-height:0}#notes{margin-top:34px}}
.hi{margin:2px 0 0;font-size:14px;color:var(--m)}
.hi b{font-weight:700;background:linear-gradient(90deg,var(--pl),#ddd6fe);-webkit-background-clip:text;background-clip:text;color:transparent}
.dbtn{position:relative;flex:none;display:flex;align-items:center;gap:5px;height:42px;padding:0 11px;border-radius:21px;color:var(--m);transition:color .3s,background-color .5s}
.dbtn:hover{color:var(--pl)}.dbtn.set{background:rgba(139,92,246,.2);color:var(--pl)}
#dl{font-size:12px;font-weight:600}
#due{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.dd{flex:none;padding:3px 9px;border-radius:10px;font-size:12px;font-weight:600;background:rgba(139,92,246,.18);color:var(--pl)}
.dd:empty{display:none}.dd.td{background:rgba(251,191,36,.16);color:#fcd34d}.dd.od{background:rgba(248,113,113,.18);color:#fca5a5}
#err.ok{color:#86efac}
.lnk{display:block;margin:12px auto 0;padding:6px;font-size:13px;color:var(--pl);text-decoration:underline;text-underline-offset:3px;transition:color .3s}.lnk:hover{color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;max-width:min(92vw,420px);padding:12px 18px;border-radius:18px;background:rgba(30,30,35,.88);border:1px solid var(--bd);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 14px 40px rgba(0,0,0,.45);font-size:14px;animation:tin .4s cubic-bezier(.2,.8,.2,1)}
.toast.out{opacity:0;transform:translate(-50%,10px);transition:opacity .4s,transform .4s}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}}
header{flex-wrap:wrap;row-gap:10px}.hr{margin-left:auto}
.me{width:38px;padding:0;justify-content:center}.me svg{display:none}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--in);border:1px solid var(--bd);color:var(--m)}
.thb .sun{display:none}[data-theme="light"] .thb .moon{display:none}[data-theme="light"] .thb .sun{display:block}
:root{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light;--t:#1b1a22;--m:#6a6a78;--p:#7c3aed;--pl:#6d28d9;--gl:rgba(255,255,255,.66);--bd:rgba(30,20,60,.12);--in:rgba(255,255,255,.8);--row:rgba(255,255,255,.8)}
[data-theme="light"] body{background:radial-gradient(circle at 90% 0%,rgba(167,139,250,.55),transparent 45%),radial-gradient(circle at 0% 100%,rgba(196,181,253,.6),transparent 50%),linear-gradient(#f6f5fa,#e6e3f0) #f1f0f6;background-attachment:fixed}
[data-theme="light"] .track{background:rgba(30,20,60,.1)}[data-theme="light"] .row{border-color:rgba(30,20,60,.08)}[data-theme="light"] .row:hover{background:#fff}
[data-theme="light"] :is(#go,#dgo,#submit,.acts .b,.gn .b,.x,.em button,.pre button,#guest){background:rgba(30,20,60,.07)}
[data-theme="light"] .seg button.on{color:#fff}[data-theme="light"] .seg button:not(.on):hover{color:var(--t)}
[data-theme="light"] .wm{background-image:linear-gradient(100deg,#4c1d95,#7c3aed 40%,#a78bfa 70%,#4c1d95)}
[data-theme="light"] .dd.td{color:#b45309;background:rgba(245,158,11,.18)}[data-theme="light"] .dd.od{color:#b91c1c;background:rgba(239,68,68,.15)}
[data-theme="light"] .toast{background:rgba(255,255,255,.94)}[data-theme="light"] .rbg{stroke:rgba(30,20,60,.1)}[data-theme="light"] #prof{background:rgba(255,255,255,.4)}
[data-theme="light"] :is(#panel,#notes,.card,.gl){box-shadow:inset 0 1px 0 #fff,0 20px 46px rgba(60,40,120,.15)}
.tt *{transition:background-color .5s,color .5s,border-color .5s}
.nav{max-width:560px;width:100%;margin:0 auto 18px}
.nav button{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 6px;font-size:14px}.nav svg{flex:none}
.vin{animation:vin .55s cubic-bezier(.2,.8,.2,1) backwards}@keyframes vin{from{opacity:0;transform:translateX(var(--dx,0))}}
.gl{background:var(--gl);border:1px solid var(--bd);border-radius:28px;-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 50px rgba(0,0,0,.3)}
.vw{width:100%;max-width:720px;margin:0 auto}#v-dl{display:flex;flex-direction:column;gap:14px}#v-tm{max-width:480px}
.dlf{flex-wrap:wrap;border-radius:26px;margin-bottom:0}#dt{min-width:150px}
#dd2{flex:none;width:132px;background:none;border:0;border-left:1px solid var(--bd);outline:0;color:var(--t);font:inherit;font-size:14px;padding-left:8px}
#dpanel{position:relative;padding:14px;min-height:280px}
.sec{margin:12px 6px 8px;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--m)}.sec:first-child{margin-top:2px}
#dlist li{animation:li2 .5s cubic-bezier(.2,.8,.2,1) backwards}@keyframes li2{from{opacity:0;transform:translateY(10px)}}
.dr{height:auto;min-height:60px;padding-top:8px;padding-bottom:8px}.tx{flex:1;min-width:0;display:flex;flex-direction:column}.tx .txt{flex:none}.mt{color:var(--m);font-size:12px}

.tmcard{padding:22px 20px}.tmw{position:relative;width:min(260px,72vw);margin:6px auto 16px}

.tmt{font:800 48px/1 "Bricolage Grotesque","Arial Black",sans-serif;font-variant-numeric:tabular-nums}.tmlab{margin-top:6px;font-size:13px;color:var(--m);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<body>
<div id="app" class="locked">

const list=$("#list"),inp=$("#inp"),panel=$("#panel");

function stats(){
  const n=S.tasks.length,d=S.tasks.filter(t=>t.done).length;
  $("#sub").textContent=STR[S.lang].stats.replace("{a}",n-d).replace("{d}",d);
  $("#fill").style.width=(n?d/n*100:0)+"%";

function row(t,delay=0){
  const li=document.createElement("li");li.dataset.id=t.id;
  li.innerHTML='<div class="row"><button class="chk" aria-label="done">✓</button><span class="txt"></span><span class="dd"></span><button class="del" aria-label="delete">✕</button></div>';

  dd(li,t);list.append(li);
  li.animate([{opacity:0,transform:"translateY(10px) scale(.97)",maxHeight:"0px",marginBottom:"0px"},
              {opacity:1,transform:"none",maxHeight:"70px",marginBottom:"8px"}],
             {duration:400,delay,easing:"cubic-bezier(.2,.8,.2,1)",fill:"backwards"});
}

  const h=li.offsetHeight;
  li.animate([{opacity:1,maxHeight:h+"px",marginBottom:"8px"},{opacity:0,maxHeight:"0px",marginBottom:"0px"}],
             {duration:340,easing:"ease",fill:"forwards"}).onfinish=()=>{li.remove();empty()};
}

  list.innerHTML="";
  S.tasks.filter(vis).sort((a,b)=>(a.due||"9")<(b.due||"9")?-1:(a.due||"9")>(b.due||"9")?1:0).forEach((t,i)=>row(t,Math.min(i,8)*45));
  stats();empty();panel.scrollTop=0;
}
function add(){
  const v=inp.value.trim();
  if(!v){$(".add").animate([{borderColor:"#f87171"},{borderColor:"rgba(180,165,235,.28)"}],{duration:450});return}
  const t={id:Date.now()+""+Math.random(),text:v,done:false,due:$("#due").value};
  S.tasks.push(t);inp.value="";$("#due").value="";dlab();save();if(t.due&&"Notification" in window&&Notification.permission==="default")Notification.requestPermission();
  if(S.filter==2)setFilter(0);
  else if(t.due)render();else{row(t);empty();stats();setTimeout(()=>panel.scrollTo({top:panel.scrollHeight,behavior:"smooth"}),60)}
}

    S.tasks=S.tasks.filter(x=>x!==t);save();stats();leave(li);

});

const enc=new TextEncoder(),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");

async function hash(pw,salt){const k=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:150000,hash:"SHA-256"},k,256))}

$("#f").onsubmit=async e=>{
  e.preventDefault();if(busy)return;
  const un=$("#u").value.trim().toLowerCase(),pw=$("#p").value,U=users();
  if(!/^[a-z0-9_.]{3,20}$/.test(un))return err("e1");
  if(mode&&pw.length<6)return err("e2");
  if(mode&&pw!==$("#p2").value)return err("e3");
  if(mode&&U[un])return err("e4");
  if(!(window.crypto&&crypto.subtle))return err("e6");
  busy=true;$("#submit").classList.add("busy");err();
  try{
    if(mode){
      const salt=hex(crypto.getRandomValues(new Uint8Array(16))),first=!Object.keys(U).length;
      U[un]={salt,hash:await hash(pw,salt)};

    }else{
      const r=U[un];if(!r)return err("e8");if(r.hash!==await hash(pw,r.salt))return err("e5");
    }
    enter(un);
  }finally{busy=false;$("#submit").classList.remove("busy")}
};

}
function closeP(){const p=$("#prof");p.classList.add("out");setTimeout(()=>p.hidden=true,420)}
function toAuth(m){
  closeP();
  setTimeout(()=>{S.user=null;S.guest=false;S.tasks=[];list.innerHTML="";$("#gn").hidden=true;$("#nb").value="";tmReset();showAuth();if(mode!==m)setMode(m)},350);
}
$("#lo").onclick=openP;$("#px").onclick=$("#pd").onclick=closeP;
$("#prof").onclick=e=>{if(e.target.id==="prof")closeP()};
$("#guest").onclick=()=>enter(null);
$("#gup").onclick=$("#pup").onclick=()=>toAuth(1);
$("#pin").onclick=()=>toAuth(0);
$("#plo").onclick=()=>{save();try{localStorage.removeItem("tg_session")}catch(e){}toAuth(0)};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=v=>new Date(v+"T00:00:00").toLocaleDateString(S.lang==="id"?"id-ID":"en-US",{day:"numeric",month:"short"});
function dd(li,t){const e=li.querySelector(".dd"),n=iso(new Date());e.textContent=t.due?fmt(t.due):"";e.className="dd"+(t.due&&!t.done?(t.due<n?" od":t.due===n?" td":""):"")}
function dlab(){const v=$("#due").value;$("#dl").textContent=v?fmt(v):"";$("#dbtn").classList.toggle("set",!!v)}
$("#due").onchange=dlab;$("#due").addEventListener("click",()=>{try{$("#due").showPicker()}catch(e){}});
function greet(){
  const h=new Date().getHours(),id=S.lang==="id";
  const g=id?["Selamat pagi","Selamat siang","Selamat sore","Selamat malam"][h>=5&&h<11?0:h>=11&&h<15?1:h>=15&&h<18?2:3]
            :["Good morning","Good afternoon","Good evening"][h>=5&&h<12?0:h>=12&&h<17?1:2];
  const el=$("#hi"),b=document.createElement("b");b.textContent=dname();el.textContent=g+", ";el.append(b);
}
setInterval(greet,60000);
let tt;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;t.classList.remove("out");void t.offsetWidth;clearTimeout(tt);
  tt=setTimeout(()=>{t.classList.add("out");setTimeout(()=>t.hidden=true,400)},4500)}
function remind(first){
  const t0=iso(new Date());let td=0,od=0;
  S.tasks.forEach(t=>{if(t.done||!t.due)return;if(t.due===t0)td++;else if(t.due<t0)od++});
  if(!td&&!od)return;
  const m=STR[S.lang].r1.replace("{t}",td).replace("{o}",od);
  if(first)toast(m);
  if("Notification" in window&&Notification.permission==="granted"&&document.hidden)try{new Notification("MyNote",{body:m})}catch(e){}
}
setInterval(()=>{if(S.user||S.guest)remind(false)},30*60000);
function exportB(){
  const u=S.user,d={app:"my-to-do-list",v:1,user:u,acct:users()[u],profile:P,tasks:S.tasks,note:$("#nb").value};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:"application/json"}));
  a.download="my-to-do-list-"+u+".json";document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast(STR[S.lang].xm);
}
function importB(txt){
  try{
    const d=JSON.parse(txt),U=users();
    if(d.app!=="my-to-do-list"||!/^[a-z0-9_.]{3,20}$/.test(d.user||"")||!d.acct||!d.acct.salt||!d.acct.hash||!Array.isArray(d.tasks))return null;
    if(U[d.user]&&!confirm(STR[S.lang].cf))return "";
    U[d.user]={salt:String(d.acct.salt),hash:String(d.acct.hash)};
    const T=d.tasks.map(t=>({id:String(t.id||Date.now()+""+Math.random()),text:String(t.text||"").slice(0,120),done:!!t.done,due:/^\d{4}-\d\d-\d\d$/.test(t.due||"")?t.due:""}));
    localStorage.setItem("tg_users",JSON.stringify(U));localStorage.setItem("tg_t_"+d.user,JSON.stringify(T));
    localStorage.setItem("tg_p_"+d.user,JSON.stringify(d.profile||{}));localStorage.setItem("tg_n_"+d.user,String(d.note||"").slice(0,4000));
    return d.user;
  }catch(e){return null}
}
let fsrc="";
$("#pex").onclick=exportB;
$("#rst").onclick=()=>{fsrc="auth";$("#fi").click()};
$("#pim").onclick=()=>{fsrc="prof";$("#fi").click()};
$("#fi").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const u=importB(await f.text());
  if(u==="")return;
  if(!u)return fsrc==="auth"?err("e7"):toast(STR[S.lang].e7);
  if(fsrc==="auth"){$("#u").value=u;if(mode)setMode(0);err("m1",1);$("#p").focus()}
  else{closeP();if(u===S.user)enter(u);toast(STR[S.lang].m2)}
};
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("tg_theme",t)}catch(e){}
  document.querySelector('meta[name="theme-color"]').content=t==="light"?"#f1f0f6":"#0a0a0c"}
document.querySelectorAll(".thb").forEach(b=>b.onclick=()=>{const r=document.documentElement;r.classList.add("tt");setTimeout(()=>r.classList.remove("tt"),600);setTheme(r.dataset.theme==="light"?"dark":"light")});
setTheme(document.documentElement.dataset.theme||"dark");

let V=1,dirty=false;
function go(i){
  const prev=V;V=i;mark($("#nav"),i);
  ["#v-dl","#main","#v-tm"].forEach((id,k)=>{const e=$(id);
    if(k===i){e.style.setProperty("--dx",(i>prev?28:-28)+"px");e.hidden=false;e.classList.remove("vin");void e.offsetWidth;e.classList.add("vin")}else e.hidden=true});
  if(i===0)renderDL();
  if(i===1&&dirty){render();dirty=false}
}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b&&+b.dataset.v!==V)go(+b.dataset.v)};
const loc=()=>S.lang==="id"?"id-ID":"en-US";
const days=v=>Math.round((new Date(v+"T00:00:00")-new Date(iso(new Date())+"T00:00:00"))/864e5);
function cd(v){const n=days(v),id=S.lang==="id";
  return n===0?(id?"Hari ini":"Today"):n===1?(id?"Besok":"Tomorrow"):n>1?(id?n+" hari lagi":"in "+n+" days"):(id?"Terlambat "+(-n)+" hari":(-n)+"d overdue")}
function dlrow(t){
  const li=document.createElement("li"),n=days(t.due);li.dataset.id=t.id;
  li.innerHTML='<div class="row dr"><button class="chk" aria-label="done">✓</button><div class="tx"><span class="txt"></span><small class="mt"></small></div><span class="dd"></span><button class="del" aria-label="delete">✕</button></div>';
  li.querySelector(".txt").textContent=t.text;
  li.querySelector(".mt").textContent=new Date(t.due+"T00:00:00").toLocaleDateString(loc(),{weekday:"short",day:"numeric",month:"short",year:"numeric"});
  const e=li.querySelector(".dd");e.textContent=cd(t.due);e.className="dd"+(n<0?" od":n===0?" td":"");
  return li;
}
function renderDL(){
  const box=$("#dlist");box.innerHTML="";
  const L=S.tasks.filter(t=>t.due&&!t.done).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0),g=[[],[],[],[]];
  L.forEach(t=>{const n=days(t.due);g[n<0?0:n===0?1:n<=7?2:3].push(t)});
  let k=0;
  g.forEach((arr,i)=>{if(!arr.length)return;
    const h=document.createElement("h3"),ul=document.createElement("ul");h.className="sec";h.textContent=STR[S.lang]["dg"+i];
    arr.forEach(t=>{const li=dlrow(t);li.style.animationDelay=Math.min(k++,10)*50+"ms";ul.append(li)});
    box.append(h,ul)});
  $("#dempty").classList.toggle("show",!L.length);
}
function dlClean(){$("#dlist").querySelectorAll("ul").forEach(u=>{if(!u.children.length){u.previousElementSibling.remove();u.remove()}});$("#dempty").classList.toggle("show",!$("#dlist").children.length)}
function addDL(){
  const v=$("#dt").value.trim(),d=$("#dd2").value;
  if(!v||!d){$(".dlf").animate([{borderColor:"#f87171"},{borderColor:"rgba(255,255,255,.11)"}],{duration:450});return}
  S.tasks.push({id:Date.now()+""+Math.random(),text:v,done:false,due:d});
  $("#dt").value="";$("#dd2").value="";save();stats();dirty=true;renderDL();
  if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();
}
$("#dgo").onclick=addDL;$("#dt").addEventListener("keydown",e=>{if(e.key==="Enter")addDL()});
$("#dd2").addEventListener("click",()=>{try{$("#dd2").showPicker()}catch(e){}});
$("#dpanel").addEventListener("click",e=>{
  const li=e.target.closest("li");if(!li)return;
  const t=S.tasks.find(x=>x.id==li.dataset.id);if(!t)return;
  if(e.target.closest(".chk")){t.done=true;li.classList.add("done");setTimeout(()=>leave(li),250)}
  else if(e.target.closest(".del")){S.tasks=S.tasks.filter(x=>x!==t);leave(li)}
  else return;
  save();stats();dirty=true;setTimeout(dlClean,650);
});

const RC=2*Math.PI*96;let T={dur:1500,left:1500,run:false,end:0},AC;
const tf=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,"0");return(h?h+":":"")+p(m)+":"+p(x)};
const RT="stroke-dashoffset .6s cubic-bezier(.3,.9,.3,1)";
function prs(){$("#pre").querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.m*60===T.dur))}
function tmDraw(){
  const l=T.run?Math.max(0,(T.end-Date.now())/1000):T.left;
  $("#tmt").textContent=tf(Math.ceil(l));$("#ring").style.strokeDashoffset=RC*(1-l/T.dur);
  document.title=T.run?tf(Math.ceil(l))+" · MyNote":"MyNote";
  if(T.run&&l<=0)tmDone();
}
function tmLoop(){if(!T.run)return;tmDraw();requestAnimationFrame(tmLoop)}
function tmBtn(){const k=T.run?"tm1":"tm0",b=$("#tgo");b.dataset.i=k;b.textContent=STR[S.lang][k];$("#tmm").disabled=T.run}
function tmSet(m){if(T.run)return;m=Math.max(1,Math.min(999,Math.round(+m)||1));T.dur=T.left=m*60;$("#tmm").value=m;$("#ring").style.transition=RT;tmDraw();prs()}
function tmReset(){T.run=false;T.left=T.dur;$("#ring").style.transition=RT;tmDraw();tmBtn()}
function tmToggle(){
  if(!T.run){
    try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
    if(T.left<=0)T.left=T.dur;T.run=true;T.end=Date.now()+T.left*1000;$("#ring").style.transition="none";tmLoop();
    if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();
  }else{T.left=Math.max(0,(T.end-Date.now())/1000);T.run=false}
  tmBtn();
}
function beep(){if(!AC)return;const n=AC.currentTime;[0,.3,.6].forEach(o=>{const s=AC.createOscillator(),g=AC.createGain();s.frequency.value=880;s.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(.0001,n+o);g.gain.exponentialRampToValueAtTime(.25,n+o+.02);g.gain.exponentialRampToValueAtTime(.0001,n+o+.24);s.start(n+o);s.stop(n+o+.26)})}
function tmDone(){
  T.run=false;T.left=T.dur;tmBtn();try{beep()}catch(e){}
  const m=STR[S.lang].tmd+($("#tml").value?" — "+$("#tml").value:"");toast(m);
  if("Notification" in window&&Notification.permission==="granted"&&document.hidden)try{new Notification("MyNote",{body:m})}catch(e){}
  $("#ring").style.transition=RT;tmDraw();const w=$("#tmw");w.classList.remove("pulse");void w.offsetWidth;w.classList.add("pulse");
}
$("#pre").onclick=e=>{const b=e.target.closest("button");if(b)tmSet(+b.dataset.m)};
$("#tmm").oninput=e=>{if(!T.run&&e.target.value){T.dur=T.left=Math.max(1,Math.min(999,+e.target.value||1))*60;tmDraw();prs()}};
$("#tml").oninput=e=>$("#tmlab").textContent=e.target.value;
$("#tgo").onclick=tmToggle;$("#trs").onclick=tmReset;
setInterval(()=>{if(T.run)tmDraw()},500);
$("#ring").style.strokeDasharray=RC;tmDraw();tmBtn();prs();
let ntm;
function note(k){const e=$("#ns");e.dataset.i=k;e.textContent=STR[S.lang][k]}
function loadNote(u){let v="";if(u)try{v=localStorage.getItem("tg_n_"+u)||""}catch(e){}$("#nb").value=v;note(u?"ns1":"ns2")}
$("#nb").oninput=()=>{clearTimeout(ntm);note("ns3");ntm=setTimeout(()=>{if(S.user)try{localStorage.setItem("tg_n_"+S.user,$("#nb").value)}catch(e){}note(S.user?"ns1":"ns2")},500)};
function boot(){
  let s=null;try{s=localStorage.getItem("tg_session")}catch(e){}
  if(s&&users()[s])enter(s);else showAuth();
}
apply();boot();
</script>
</body>
