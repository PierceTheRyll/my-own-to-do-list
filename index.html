<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>My To Do List</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
<style>
:root{--t:#f2f2f6;--m:#9494a0;--p:#8b5cf6;--pl:#a78bfa;--gl:rgba(30,30,35,.6);--bd:rgba(255,255,255,.11);--in:rgba(18,18,21,.75);--row:rgba(44,44,52,.62);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow-x:hidden;overflow-y:auto;color:var(--t);background:#15121d;
font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
background:radial-gradient(circle at 90% 0%,rgba(124,58,237,.38),transparent 45%),radial-gradient(circle at 0% 100%,rgba(109,40,217,.28),transparent 50%),linear-gradient(#17171a,#08080a) #0a0a0c;background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{position:relative;max-width:480px;min-height:100%;margin:0 auto;padding:22px 18px 28px;display:flex;flex-direction:column;animation:fi .7s ease backwards}
#app>*{position:relative;z-index:1}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@keyframes sf{to{opacity:1}}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{margin:6px 0 4px;font-size:27px;line-height:1.15}
#sub{color:var(--m);font-size:14px}
[data-i],#sub{transition:opacity .16s}
.seg{--n:2;position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:4px;border-radius:16px;background:var(--in);border:1px solid var(--bd)}
.seg button{position:relative;z-index:1;padding:6px 12px;border-radius:12px;font-size:13px;font-weight:600;color:var(--m);transition:color .25s,background-color .7s,opacity .16s}
.seg button.on{color:var(--t)}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:12px;background:var(--p);box-shadow:0 4px 14px rgba(139,92,246,.45);transition:transform .32s cubic-bezier(.3,.9,.3,1)}
.tabs button{padding:9px 0;font-size:14px}
.track{height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin:12px 0 16px;overflow:hidden}
#fill{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--p),var(--pl));transition:width .55s cubic-bezier(.3,.9,.3,1)}
.add{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 20px;border-radius:28px;background:var(--in);border:1px solid var(--bd);margin-bottom:12px;transition:border-color .25s,box-shadow .25s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.add:focus-within{border-color:var(--pl);box-shadow:0 0 0 3px rgba(167,139,250,.2)}
#inp{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--t);font:inherit;font-size:16px}
#inp::placeholder{color:var(--m)}
#go{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.1);font-size:24px;line-height:1}
.tabs{margin-bottom:14px}
#panel{position:relative;flex:none;height:min(50vh,440px);min-height:260px;overflow-y:auto;scrollbar-width:none;padding:12px;border-radius:28px;background:var(--gl);border:1px solid var(--bd);
backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 24px 50px rgba(0,0,0,.3)}
#panel::-webkit-scrollbar{display:none}
ul{margin:0;padding:0;list-style:none}
li{margin-bottom:8px;overflow:hidden;border-radius:18px}
.row{display:flex;align-items:center;gap:12px;height:54px;padding:0 8px 0 14px;border-radius:18px;background:var(--row);border:1px solid rgba(255,255,255,.07);transition:background .2s}
.row:hover{background:rgba(70,70,82,.7)}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--m);display:grid;place-items:center;font-size:13px;font-weight:700;color:transparent;transition:all .28s cubic-bezier(.3,.9,.3,1)}
.done .chk{background:var(--p);border-color:var(--pl);color:#fff;transform:scale(1.08)}
.txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .3s}
.done .txt{color:var(--m);text-decoration:line-through}
.del{flex:none;width:36px;height:36px;border-radius:50%;color:var(--m);opacity:.55;transition:opacity .2s,color .2s}
.del:hover{opacity:1;color:#f0abfc}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;white-space:pre-line;color:var(--m);opacity:0;pointer-events:none;transition:opacity .5s}
#empty.show{opacity:1}
[hidden]{display:none!important}
.hr{display:flex;align-items:center;gap:8px}
.me{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px 0 4px;border-radius:19px;background:var(--in);border:1px solid var(--bd);color:var(--m)}
.me b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--pl));color:#fff;font-size:14px}
#app.locked>*:not(#sil){opacity:0;pointer-events:none;transition:opacity .35s}
@keyframes up{from{opacity:0;transform:translateY(16px);filter:blur(6px)}}
#app.enter>*:not(#sil){animation:up .65s cubic-bezier(.2,.8,.2,1) backwards}
#auth{position:fixed;inset:0;z-index:3;display:grid;place-items:center;padding:20px;overflow-y:auto;transition:opacity .5s,transform .5s,filter .5s}
#auth.out{opacity:0;transform:scale(1.04);filter:blur(12px);pointer-events:none}
.card{width:min(390px,100%);padding:22px 20px 18px;border-radius:32px;background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 30px 70px rgba(0,0,0,.4);animation:pop .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.96)}}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brand b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--pl));box-shadow:0 4px 14px rgba(139,92,246,.5)}
.card h2{margin:6px 0 4px;font-size:19px;text-align:center}.card p{margin:0 0 16px;color:var(--m);font-size:14px;text-align:center}
.fld{display:flex;align-items:center;gap:8px;height:50px;margin-top:10px;padding:0 10px 0 18px;border-radius:26px;background:var(--in);border:1px solid var(--bd);transition:border-color .25s,box-shadow .25s}
.fld:focus-within{border-color:var(--pl);box-shadow:0 0 0 3px rgba(167,139,250,.2)}
.fld input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--t);font:inherit;font-size:16px}
.fld input::placeholder{color:var(--m)}
#eye{font-size:13px;color:var(--pl);padding:6px}
.conf{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .4s cubic-bezier(.3,.9,.3,1),opacity .3s}
.conf>div{overflow:hidden}.signup .conf{grid-template-rows:1fr;opacity:1}
#err{min-height:20px;margin:12px 4px 0;font-size:13px;color:#f9a8d4;opacity:0;transition:opacity .25s}#err.show{opacity:1}
#submit{width:100%;height:50px;margin-top:4px;border-radius:26px;font-weight:700;font-size:16px;background:rgba(255,255,255,.1);border:1px solid var(--bd)}
#submit.busy{pointer-events:none;animation:pl 1s infinite}@keyframes pl{50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
.card small{display:block;margin-top:14px;text-align:center;color:var(--m);font-size:12px}
#app.enter>:not(#sil):nth-child(2){animation-delay:.08s}
.b{position:relative;isolation:isolate;overflow:hidden;transition:color .4s,transform .15s,box-shadow .7s,opacity .16s}
.b::before,.b::after{content:"";position:absolute;inset:0;z-index:-1;opacity:0}
.b::before{background:linear-gradient(135deg,#a78bfa,#7c3aed 60%,#6d28d9);transition:opacity .9s ease}
.b::after{background:linear-gradient(135deg,#7c3aed,#5b21b6);transition:opacity .35s ease}
@media(hover:hover){.b:hover::before{opacity:.92}.b:hover{color:#fff;box-shadow:0 8px 26px rgba(139,92,246,.35)}
.seg button:not(.on):hover{background:rgba(139,92,246,.3);color:#fff}}
.b:active::after{opacity:1;transition:opacity .1s}.b:active{transform:scale(.96)}
.seg button:active{background:rgba(139,92,246,.6)}
.or{display:flex;align-items:center;gap:10px;margin:14px 0 6px;color:var(--m);font-size:12px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--bd)}
#guest{width:100%;height:46px;margin-top:6px;border-radius:26px;background:rgba(255,255,255,.06);border:1px solid var(--bd);font-weight:600}
.gn{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:8px 8px 8px 14px;border-radius:18px;background:rgba(139,92,246,.12);border:1px solid rgba(167,139,250,.25);font-size:13px;color:var(--m);animation:up .5s cubic-bezier(.2,.8,.2,1)}
.gn .b{flex:none;padding:7px 14px;border-radius:14px;background:rgba(255,255,255,.1);font-size:13px;font-weight:600;color:var(--t)}
#prof{position:fixed;inset:0;z-index:4;display:grid;place-items:center;padding:20px;overflow-y:auto;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .4s}
#prof.out{opacity:0;pointer-events:none}
.ptitle{font-size:20px}.x{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08)}
.pav{width:84px;height:84px;margin:16px auto 8px;border-radius:50%;display:grid;place-items:center;font-size:36px;font-weight:700;color:#fff;box-shadow:0 12px 34px rgba(139,92,246,.4)}
.lbl{margin:14px 4px 8px;color:var(--m);font-size:13px}
.sw,.em{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:32px;height:32px;border-radius:50%;border:2px solid transparent;transition:transform .25s,border-color .4s}
.sw button:hover{transform:scale(1.12)}.sw button.on{border-color:#fff;transform:scale(1.15)}
.em button{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.08);font-size:18px}.em button.on{outline:2px solid var(--pl)}
.acts{display:flex;gap:10px;margin-top:18px}.acts .b{flex:1;height:46px;border-radius:24px;background:rgba(255,255,255,.1);border:1px solid var(--bd);font-weight:600}
.pn{margin:16px 0 0;text-align:center;color:var(--m);font-size:13px}
.sn{margin:-1px 0 5px;font:700 13px "Bricolage Grotesque","Arial Black",sans-serif;color:var(--pl);letter-spacing:.6px}
.wm{margin:16px 0 6px;text-align:center;font:800 clamp(30px,9.5vw,42px)/1.05 "Bricolage Grotesque","Arial Black",Impact,sans-serif;font-variation-settings:"opsz" 96;letter-spacing:-.8px;
background:linear-gradient(100deg,#fff 0%,#c4b5fd 35%,#8b5cf6 65%,#fff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s ease-in-out infinite alternate}
@keyframes sh{to{background-position:100% 0}}
.lang i{background:#dc2626 linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0));box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.95),0 4px 14px rgba(220,38,38,.5);transition:transform .32s cubic-bezier(.3,.9,.3,1),background-color .55s,box-shadow .55s}
.lang[data-v="1"] i{background-color:#2563eb;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0),0 4px 14px rgba(37,99,235,.5)}
.lang button.on{color:#fff}
@media(hover:hover){.lang button[data-l="id"]:not(.on):hover{background:rgba(220,38,38,.35)}.lang button[data-l="en"]:not(.on):hover{background:rgba(37,99,235,.4)}}
.lang button[data-l="id"]:active{background:rgba(220,38,38,.7)}.lang button[data-l="en"]:active{background:rgba(37,99,235,.7)}
#main{display:flex;flex-direction:column;gap:18px}#tasks{display:flex;flex-direction:column;min-width:0}
#notes{display:flex;flex-direction:column;min-width:0;min-height:260px;padding:16px 16px 12px;border-radius:28px;background:var(--gl);border:1px solid var(--bd);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 50px rgba(0,0,0,.3);transition:border-color .3s,box-shadow .4s}
#notes:focus-within{border-color:rgba(167,139,250,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 3px rgba(139,92,246,.15),0 24px 50px rgba(0,0,0,.3)}
#app.enter #notes{animation:up .7s .3s cubic-bezier(.2,.8,.2,1) backwards}
.nh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.ns{font-size:12px;font-weight:400;color:var(--m)}
#nb{flex:1;min-height:180px;width:100%;resize:none;background:none;border:0;outline:0;color:var(--t);font:inherit;font-size:15px;line-height:1.65}
#nb::placeholder{color:var(--m)}
@media(min-width:860px){#app{max-width:1040px;height:100%}
#main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);gap:22px}
#tasks,#notes{min-height:0}#panel{flex:1;height:auto;min-height:0}#notes{margin-top:34px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app" class="locked">
  <header>
    <div><h1 data-i="title">Tugas Saya</h1><div class="sn">My To Do List</div><div id="sub"></div></div>
    <div class="hr"><button class="me b" id="lo" aria-label="profile"><b id="av"></b><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button><div class="seg lang" id="lang"><i></i><button data-l="id">ID</button><button data-l="en">EN</button></div></div>
  </header>
  <div id="main"><div id="tasks">
  <div class="track"><div id="fill"></div></div>
  <div class="add"><input id="inp" autocomplete="off" maxlength="120"><button id="go" class="b" aria-label="add">+</button></div>
  <div class="seg tabs" id="tabs" style="--n:3"><i></i><button data-f="0" data-i="t0"></button><button data-f="1" data-i="t1"></button><button data-f="2" data-i="t2"></button></div>
  <div id="gn" class="gn" hidden><span data-i="gnote"></span><button class="b" id="gup" data-i="m2"></button></div>
  <div id="panel"><ul id="list"></ul><div id="empty" data-i="empty"></div></div>
  </div>
  <aside id="notes"><div class="nh"><span data-i="nt"></span><span class="ns" id="ns" data-i="ns1"></span></div><textarea id="nb" data-p="np" maxlength="4000" spellcheck="false"></textarea></aside>
  </div>
</div>
<div id="auth" class="out" hidden><div id="card" class="card">
<div class="top"><div class="brand"><b>✓</b></div><div class="seg lang" id="lang2"><i></i><button data-l="id">ID</button><button data-l="en">EN</button></div></div>
<div class="wm">My To Do List</div>
<h2 id="ttl" data-i="a1"></h2><p id="tts" data-i="a1s"></p>
<div class="seg" id="mode"><i></i><button type="button" data-m="0" data-i="m1"></button><button type="button" data-m="1" data-i="m2"></button></div>
<form id="f" novalidate>
<label class="fld"><input id="u" data-p="pu" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20"></label>
<label class="fld"><input id="p" type="password" data-p="pp" autocomplete="current-password"><button type="button" id="eye" data-i="sh"></button></label>
<div class="conf"><div><label class="fld"><input id="p2" type="password" data-p="pc" autocomplete="new-password"></label></div></div>
<div id="err" role="alert"></div>
<button id="submit" class="b" data-i="b1"></button></form>
<div class="or"><span data-i="or"></span></div>
<button id="guest" class="b" type="button" data-i="gb"></button>
<small data-i="note"></small></div></div>
<div id="prof" class="out" hidden><div class="card" id="pcard">
<div class="top"><b class="ptitle" data-i="pt"></b><button class="x b" id="px" aria-label="close">✕</button></div>
<div class="pav" id="pav"></div>
<label class="fld"><input id="pn" data-p="pnm" maxlength="24" autocomplete="off"></label>
<div class="lbl" data-i="pcol"></div><div class="sw" id="sw"></div>
<div class="lbl" data-i="pem"></div><div class="em" id="em"></div>
<div id="pa1" class="acts"><button class="b" id="pd" data-i="t2"></button><button class="b" id="plo" data-i="lo"></button></div>
<div id="pa2" hidden><p class="pn" data-i="gnote"></p><div class="acts"><button class="b" id="pin" data-i="m1"></button><button class="b" id="pup" data-i="m2"></button></div></div>
</div></div>
<script>
const $=s=>document.querySelector(s);
const STR={
 id:{nt:"Catatan",np:"Tulis catatanmu di sini…",ns1:"Tersimpan",ns2:"Tidak disimpan (tamu)",ns3:"Menyimpan…",gb:"Lanjut sebagai tamu",or:"atau",gnote:"Mode tamu: tugas tidak disimpan.",guest:"Tamu",pt:"Profil",pnm:"Nama tampilan",pcol:"Warna avatar",pem:"Ikon avatar",lo:"Keluar",a1:"Selamat datang kembali",a1s:"Masuk untuk membuka daftar tugasmu.",a2:"Buat akun",a2s:"Daftar dalam hitungan detik.",m1:"Masuk",m2:"Daftar",b1:"Masuk",b2:"Buat akun",pu:"Nama pengguna",pp:"Kata sandi",pc:"Ulangi kata sandi",sh:"Lihat",hd:"Sembunyi",note:"Akun hanya tersimpan di browser ini.",e1:"Nama pengguna 3–20 karakter (huruf, angka, _ .).",e2:"Kata sandi minimal 6 karakter.",e3:"Kata sandi tidak sama.",e4:"Nama pengguna sudah dipakai.",e5:"Nama pengguna atau kata sandi salah.",e6:"Browser ini tidak mendukung login aman (butuh HTTPS).",title:"Tugas Saya",stats:"{a} aktif · {d} selesai",ph:"Tambah tugas baru…",t0:"Semua",t1:"Aktif",t2:"Selesai",empty:"Belum ada tugas\nKetik sesuatu di atas ✨"},
 en:{nt:"Notes",np:"Write your notes here…",ns1:"Saved",ns2:"Not saved (guest)",ns3:"Saving…",gb:"Continue as guest",or:"or",gnote:"Guest mode: tasks aren't saved.",guest:"Guest",pt:"Profile",pnm:"Display name",pcol:"Avatar color",pem:"Avatar icon",lo:"Log out",a1:"Welcome back",a1s:"Sign in to open your task list.",a2:"Create account",a2s:"Sign up in seconds.",m1:"Sign in",m2:"Sign up",b1:"Sign in",b2:"Create account",pu:"Username",pp:"Password",pc:"Confirm password",sh:"Show",hd:"Hide",note:"Accounts are stored in this browser only.",e1:"Username: 3–20 characters (letters, numbers, _ .).",e2:"Password must be at least 6 characters.",e3:"Passwords don't match.",e4:"That username is taken.",e5:"Wrong username or password.",e6:"Secure login isn't supported here (needs HTTPS).",title:"My Tasks",stats:"{a} active · {d} done",ph:"Add a new task…",t0:"All",t1:"Active",t2:"Done",empty:"No tasks yet\nType something above ✨"}};
const S={tasks:[],lang:null,filter:0,user:null,legacy:[]};
try{const d=JSON.parse(localStorage.getItem("tg")||"{}");S.legacy=d.tasks||[];S.lang=d.lang}catch(e){}
if(!STR[S.lang])S.lang=(navigator.language||"").startsWith("id")?"id":"en";
const save=()=>{try{localStorage.setItem("tg",JSON.stringify({lang:S.lang}));if(S.user)localStorage.setItem("tg_t_"+S.user,JSON.stringify(S.tasks))}catch(e){}};
const list=$("#list"),inp=$("#inp"),panel=$("#panel");
const vis=t=>S.filter==0||(S.filter==1&&!t.done)||(S.filter==2&&t.done);

function stats(){
  const n=S.tasks.length,d=S.tasks.filter(t=>t.done).length;
  $("#sub").textContent=STR[S.lang].stats.replace("{a}",n-d).replace("{d}",d);
  $("#fill").style.width=(n?d/n*100:0)+"%";
}
const empty=()=>$("#empty").classList.toggle("show",!list.children.length);

function row(t,delay=0){
  const li=document.createElement("li");li.dataset.id=t.id;
  li.innerHTML='<div class="row"><button class="chk" aria-label="done">✓</button><span class="txt"></span><button class="del" aria-label="delete">✕</button></div>';
  li.querySelector(".txt").textContent=t.text;
  li.classList.toggle("done",t.done);
  list.append(li);
  li.animate([{opacity:0,transform:"translateY(10px) scale(.97)",maxHeight:"0px",marginBottom:"0px"},
              {opacity:1,transform:"none",maxHeight:"70px",marginBottom:"8px"}],
             {duration:400,delay,easing:"cubic-bezier(.2,.8,.2,1)",fill:"backwards"});
}
function leave(li){
  const h=li.offsetHeight;
  li.animate([{opacity:1,maxHeight:h+"px",marginBottom:"8px"},{opacity:0,maxHeight:"0px",marginBottom:"0px"}],
             {duration:340,easing:"ease",fill:"forwards"}).onfinish=()=>{li.remove();empty()};
}
function render(){
  list.innerHTML="";
  S.tasks.filter(vis).forEach((t,i)=>row(t,Math.min(i,8)*45));
  stats();empty();panel.scrollTop=0;
}
function add(){
  const v=inp.value.trim();
  if(!v){$(".add").animate([{borderColor:"#f87171"},{borderColor:"rgba(180,165,235,.28)"}],{duration:450});return}
  const t={id:Date.now()+""+Math.random(),text:v,done:false};
  S.tasks.push(t);inp.value="";save();
  if(S.filter==2)setFilter(0);
  else{row(t);empty();stats();setTimeout(()=>panel.scrollTo({top:panel.scrollHeight,behavior:"smooth"}),60)}
}
list.addEventListener("click",e=>{
  const li=e.target.closest("li");if(!li)return;
  const t=S.tasks.find(x=>x.id==li.dataset.id);if(!t)return;
  if(e.target.closest(".chk")){
    t.done=!t.done;li.classList.toggle("done",t.done);save();stats();
    if(!vis(t))setTimeout(()=>leave(li),300);
  }else if(e.target.closest(".del")){
    S.tasks=S.tasks.filter(x=>x!==t);save();stats();leave(li);
  }
});
$("#go").onclick=add;
inp.addEventListener("keydown",e=>{if(e.key==="Enter")add()});

function mark(seg,i,attr){
  seg.dataset.v=i;seg.querySelector("i").style.transform=`translateX(${i*100}%)`;
  seg.querySelectorAll("button").forEach((b,k)=>b.classList.toggle("on",k===i));
}
function setFilter(i){S.filter=i;mark($("#tabs"),i);render()}
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(b)setFilter(+b.dataset.f)};

function apply(){
  const T=STR[S.lang];
  document.documentElement.lang=S.lang;document.title="My To Do List";inp.placeholder=T.ph;document.querySelectorAll("[data-p]").forEach(el=>el.placeholder=T[el.dataset.p]);const ek=$("#err").dataset.k;if(ek)$("#err").textContent=T[ek];
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=T[el.dataset.i]);
  stats();paint();
}
function setLang(l){
  if(l===S.lang)return;
  S.lang=l;save();mark($("#lang"),l==="id"?0:1);mark($("#lang2"),l==="id"?0:1);
  const els=document.querySelectorAll("[data-i],#sub");
  els.forEach(el=>el.style.opacity=0);
  setTimeout(()=>{apply();els.forEach(el=>el.style.opacity="")},170);
}
$("#lang").onclick=$("#lang2").onclick=e=>{const b=e.target.closest("button");if(b)setLang(b.dataset.l)};

mark($("#lang"),S.lang==="id"?0:1);mark($("#lang2"),S.lang==="id"?0:1);mark($("#tabs"),0);mark($("#mode"),0);
const enc=new TextEncoder(),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const users=()=>{try{return JSON.parse(localStorage.getItem("tg_users")||"{}")}catch(e){return{}}};
async function hash(pw,salt){const k=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:150000,hash:"SHA-256"},k,256))}
let mode=0,busy=false;
function swap(els){els.forEach(e=>e.style.opacity=0);setTimeout(()=>{apply();els.forEach(e=>e.style.opacity="")},160)}
function err(k){
  const e=$("#err");e.dataset.k=k||"";e.classList.toggle("show",!!k);
  if(k){e.textContent=STR[S.lang][k];$("#card").animate([{transform:"none"},{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"translateX(-4px)"},{transform:"none"}],{duration:380})}
}
function setMode(m){
  mode=m;$("#card").classList.toggle("signup",!!m);mark($("#mode"),m);
  $("#ttl").dataset.i=m?"a2":"a1";$("#tts").dataset.i=m?"a2s":"a1s";$("#submit").dataset.i=m?"b2":"b1";
  $("#p").autocomplete=m?"new-password":"current-password";err();swap([$("#ttl"),$("#tts"),$("#submit")]);
}
$("#mode").onclick=e=>{const b=e.target.closest("button");if(b&&+b.dataset.m!==mode)setMode(+b.dataset.m)};
$("#eye").onclick=()=>{const p=$("#p"),s=p.type==="password",k=s?"hd":"sh";p.type=s?"text":"password";$("#eye").dataset.i=k;$("#eye").textContent=STR[S.lang][k]};
$("#f").onsubmit=async e=>{
  e.preventDefault();if(busy)return;
  const un=$("#u").value.trim().toLowerCase(),pw=$("#p").value,U=users();
  if(!/^[a-z0-9_.]{3,20}$/.test(un))return err("e1");
  if(mode&&pw.length<6)return err("e2");
  if(mode&&pw!==$("#p2").value)return err("e3");
  if(mode&&U[un])return err("e4");
  if(!(window.crypto&&crypto.subtle))return err("e6");
  busy=true;$("#submit").classList.add("busy");err();
  try{
    if(mode){
      const salt=hex(crypto.getRandomValues(new Uint8Array(16))),first=!Object.keys(U).length;
      U[un]={salt,hash:await hash(pw,salt)};
      try{localStorage.setItem("tg_users",JSON.stringify(U));if(first&&S.legacy.length){localStorage.setItem("tg_t_"+un,JSON.stringify(S.legacy));S.legacy=[]}}catch(x){}
    }else{
      const r=U[un];if(!r||r.hash!==await hash(pw,r.salt))return err("e5");
    }
    enter(un);
  }finally{busy=false;$("#submit").classList.remove("busy")}
};
function enter(u){
  S.user=u;S.guest=!u;S.filter=0;S.tasks=[];P={name:"",c:0,e:""};
  if(u){
    try{S.tasks=JSON.parse(localStorage.getItem("tg_t_"+u)||"[]")}catch(e){}
    try{Object.assign(P,JSON.parse(localStorage.getItem("tg_p_"+u)||"{}"))}catch(e){}
    try{localStorage.setItem("tg_session",u)}catch(e){}
  }
  $("#gn").hidden=!S.guest;pick();loadNote(u);$("#f").reset();
  const a=$("#auth"),app=$("#app");
  a.classList.add("out");setTimeout(()=>a.hidden=true,520);
  app.classList.remove("locked","enter");void app.offsetWidth;app.classList.add("enter");
  mark($("#tabs"),0);save();render();
}
function showAuth(){
  const a=$("#auth");a.hidden=false;$("#app").classList.add("locked");$("#app").classList.remove("enter");
  requestAnimationFrame(()=>requestAnimationFrame(()=>a.classList.remove("out")));
}
const COLORS=[["#8b5cf6","#6d28d9"],["#a78bfa","#7c3aed"],["#c084fc","#9333ea"],["#e879f9","#a21caf"],["#71717a","#3f3f46"],["#f472b6","#9d174d"]];
const EMO=["","🙂","😎","🦊","🐱","🌙","⚡","🎧"];
let P={name:"",c:0,e:""};
const dname=()=>P.name||S.user||STR[S.lang].guest;
function paint(){
  const g=COLORS[P.c]||COLORS[0],t=(P.e||(dname()[0]||"?")).toUpperCase();
  [$("#av"),$("#pav")].forEach(a=>{a.textContent=t;a.style.background=`linear-gradient(135deg,${g[0]},${g[1]})`});
  $("#lo").title=dname();
}
function pick(){
  if(S.user)try{localStorage.setItem("tg_p_"+S.user,JSON.stringify(P))}catch(e){}
  paint();
  $("#sw").querySelectorAll("button").forEach((b,i)=>b.classList.toggle("on",i==P.c));
  $("#em").querySelectorAll("button").forEach((b,i)=>b.classList.toggle("on",EMO[i]==P.e));
}
$("#sw").innerHTML=COLORS.map((g,i)=>`<button type="button" data-c="${i}" style="background:linear-gradient(135deg,${g[0]},${g[1]})"></button>`).join("");
$("#em").innerHTML=EMO.map((e,i)=>`<button type="button" class="b" data-e="${i}">${e||"Aa"}</button>`).join("");
$("#sw").onclick=e=>{const b=e.target.closest("button");if(b){P.c=+b.dataset.c;pick()}};
$("#em").onclick=e=>{const b=e.target.closest("button");if(b){P.e=EMO[+b.dataset.e];pick()}};
$("#pn").oninput=e=>{P.name=e.target.value.trim();pick()};
function openP(){
  $("#pn").value=P.name;$("#pa1").hidden=S.guest;$("#pa2").hidden=!S.guest;pick();
  const p=$("#prof");p.hidden=false;requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.remove("out")));
}
function closeP(){const p=$("#prof");p.classList.add("out");setTimeout(()=>p.hidden=true,420)}
function toAuth(m){
  closeP();
  setTimeout(()=>{S.user=null;S.guest=false;S.tasks=[];list.innerHTML="";$("#gn").hidden=true;$("#nb").value="";showAuth();if(mode!==m)setMode(m)},350);
}
$("#lo").onclick=openP;$("#px").onclick=$("#pd").onclick=closeP;
$("#prof").onclick=e=>{if(e.target.id==="prof")closeP()};
$("#guest").onclick=()=>enter(null);
$("#gup").onclick=$("#pup").onclick=()=>toAuth(1);
$("#pin").onclick=()=>toAuth(0);
$("#plo").onclick=()=>{save();try{localStorage.removeItem("tg_session")}catch(e){}toAuth(0)};
let ntm;
function note(k){const e=$("#ns");e.dataset.i=k;e.textContent=STR[S.lang][k]}
function loadNote(u){let v="";if(u)try{v=localStorage.getItem("tg_n_"+u)||""}catch(e){}$("#nb").value=v;note(u?"ns1":"ns2")}
$("#nb").oninput=()=>{clearTimeout(ntm);note("ns3");ntm=setTimeout(()=>{if(S.user)try{localStorage.setItem("tg_n_"+S.user,$("#nb").value)}catch(e){}note(S.user?"ns1":"ns2")},500)};
function boot(){
  let s=null;try{s=localStorage.getItem("tg_session")}catch(e){}
  if(s&&users()[s])enter(s);else showAuth();
}
apply();boot();
</script>
</body>
</html>
